[project]
name = "media-hub-polymarket-worker"
version = "0.1.0"
description = "Polymarket worker for media-hub"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "PyYAML>=6.0.1"
]

[project.scripts]
media-hub-polymarket = "media_hub_polymarket.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
