[project]
name = "media-hub-rss-worker"
version = "0.1.0"
description = "RSS worker for media-hub"
requires-python = ">=3.11"
dependencies = [
  "feedparser>=6.0.11",
  "httpx>=0.27.0",
  "PyYAML>=6.0.1",
  "trafilatura>=1.8.0"
]

[project.scripts]
media-hub-rss = "media_hub_rss.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
